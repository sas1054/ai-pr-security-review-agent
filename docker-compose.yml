# Local development stack — no Azure credentials required.
# Start with: docker-compose up --build
#
# What runs locally:
#   gateway           — admin UI and webhook compatibility endpoint on http://localhost:8000
#   webhook-receiver  — native Functions compatibility endpoint on http://localhost:7071/api/webhook
#   orchestrator      — runs the checked-in local fixture and exits
#
# What is stubbed:
#   Service Bus → not connected; webhook logs the job payload instead of enqueuing
#   Key Vault   → not connected; local mode permits unsigned requests explicitly
#   ADO API     → replaced by a deterministic fixture adapter
#   Semgrep     → replaced by an empty fake in the fixture runner

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"

  webhook-receiver:
    build:
      context: src
      dockerfile: webhook-receiver/Dockerfile
    ports:
      - "7071:80"
    environment:
      ENVIRONMENT: local
      ALLOW_UNSIGNED_LOCAL: "true"
      SERVICE_BUS_NAMESPACE: ""
      AzureWebJobsStorage: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFeqCnf2g==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;
    depends_on:
      - azurite
    restart: unless-stopped

  gateway:
    build:
      context: src
      dockerfile: webhook-receiver/Dockerfile.admin
    ports:
      - "8000:8000"
    environment:
      ADMIN_ACCESS_KEY: local-admin
      ENVIRONMENT: local
      HACKATHON_MODE: "false"
      SERVICE_BUS_NAMESPACE: ""
      AZURE_STORAGE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFeqCnf2g==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;
    depends_on:
      - azurite
    restart: unless-stopped

  orchestrator:
    build:
      context: src
      dockerfile: orchestrator/Dockerfile
    environment:
      ENVIRONMENT: local
      SERVICE_BUS_NAMESPACE: ""
    command: python orchestrator.py --fixture fixtures/local_job.json
    depends_on:
      - webhook-receiver
