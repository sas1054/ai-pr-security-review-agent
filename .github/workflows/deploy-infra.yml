name: Deploy Infrastructure

# Manual trigger only — requires Azure OIDC secrets to be configured first.
# See docs/runbook.md "Configuring the GitHub Actions OIDC trust" before enabling push trigger.
on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options: [dev, staging, prod]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Bicep deploy
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.env }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Bicep what-if
        run: |
          az deployment sub what-if \
            --location ${{ vars.AZURE_LOCATION || 'eastus' }} \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --parameters env=${{ github.event.inputs.env }}

      - name: Deploy
        run: |
          az deployment sub create \
            --location ${{ vars.AZURE_LOCATION || 'eastus' }} \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --parameters env=${{ github.event.inputs.env }} \
            --output json

      - name: Azure logout
        if: always()
        run: az logout
